# Template for the azuredrop-secret Secret referenced by the API deployment.
# Copy, fill in real values and apply out-of-band (or use the local overlay's
# secretGenerator for Minikube). NEVER commit the filled-in file.
#
#   kubectl apply -f secret.example.yaml
#
apiVersion: v1
kind: Secret
metadata:
  name: azuredrop-secret
  labels:
    app.kubernetes.io/part-of: azuredrop
type: Opaque
stringData:
  JWT_SECRET: "replace-with-a-long-random-string"
  POSTGRES_PASSWORD: "replace-with-a-strong-password"
  DATABASE_URL: "postgresql://azuredrop:replace-with-a-strong-password@postgres:5432/azuredrop"
  AZURE_STORAGE_CONNECTION_STRING: "DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=replace-me;BlobEndpoint=http://azurite:10000/devstoreaccount1;"
