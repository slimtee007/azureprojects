server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Security headers
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # SPA routing: unknown paths fall back to index.html (e.g. /share/<token>)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API + health reverse proxy to the backend container
    location /api/ {
        proxy_pass http://azuredrop-api:5001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 30m;
    }

    location /health {
        proxy_pass http://azuredrop-api:5001/health;
        proxy_set_header Host $host;
    }

    # Browser-facing Azure Blob path (Azurite stays private on the Docker
    # network; signed download/share URLs point here).
    location /devstoreaccount1/ {
        proxy_pass http://azuredrop-azurite:10000/devstoreaccount1/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
