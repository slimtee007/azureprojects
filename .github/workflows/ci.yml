name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    name: Backend tests (PostgreSQL + Azurite)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: azuredrop
          POSTGRES_PASSWORD: azuredrop-ci
          POSTGRES_DB: azuredrop
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U azuredrop -d azuredrop"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
      azurite:
        image: mcr.microsoft.com/azure-storage/azurite:3.33.0
        ports:
          - 10000:10000
    env:
      TEST_USE_EXTERNAL_SERVICES: "true"
      DATABASE_URL: postgresql://azuredrop:azuredrop-ci@localhost:5432/azuredrop
      AZURE_STORAGE_CONNECTION_STRING: >-
        DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://127.0.0.1:10000/devstoreaccount1;
      AZURE_STORAGE_PUBLIC_BASE_URL: http://127.0.0.1:10000/devstoreaccount1
      JWT_SECRET: ci-only-jwt-secret
      CORS_ORIGINS: http://localhost:5173
      PUBLIC_BASE_URL: http://localhost:5173
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Wait for PostgreSQL and Azurite
        run: |
          for i in $(seq 1 30); do
            if timeout 1 bash -c 'cat < /dev/null > /dev/tcp/localhost/5432' 2>/dev/null \
              && timeout 1 bash -c 'cat < /dev/null > /dev/tcp/localhost/10000' 2>/dev/null; then
              echo "services are up"
              exit 0
            fi
            sleep 2
          done
          echo "services did not become ready" >&2
          exit 1

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Migrate database
        working-directory: backend
        run: npm run migrate

      - name: Run Jest tests
        working-directory: backend
        run: npm test

      - name: Smoke test (API + /health)
        working-directory: backend
        run: |
          npm start &
          for i in $(seq 1 30); do
            curl -sf http://localhost:5001/health && break
            sleep 2
          done
          curl -sf http://localhost:5001/health | tee /tmp/health.json
          jq -e '.status == "healthy" and .database == "healthy" and .storage == "healthy"' /tmp/health.json

  frontend-build:
    name: Frontend lint + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Production build
        working-directory: frontend
        run: npm run build

  terraform-validate:
    name: Terraform fmt + validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Validate Azure target design
        working-directory: terraform/azure
        run: |
          terraform init -backend=false
          terraform validate

      - name: Validate AWS demo infrastructure
        working-directory: terraform/aws
        run: |
          terraform init -backend=false
          terraform validate

  docker-build:
    name: Docker image build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build API image
        run: docker build -t azuredrop-api:ci backend

      - name: Build frontend image
        run: docker build -t azuredrop-frontend:ci frontend
