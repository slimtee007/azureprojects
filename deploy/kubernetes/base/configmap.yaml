# Non-secret configuration for the AzureDrop API.
# Secrets (JWT, DB password, storage connection string) live in the
# azuredrop-secret Secret - see overlays/*/kustomization.yaml (secretGenerator)
# and secret.example.yaml. Never commit real secrets to Git.
apiVersion: v1
kind: ConfigMap
metadata:
  name: azuredrop-config
  labels:
    app.kubernetes.io/part-of: azuredrop
data:
  PORT: "5001"
  CORS_ORIGINS: "http://localhost:5173"
  PUBLIC_BASE_URL: "http://localhost:5173"
  AZURE_STORAGE_PUBLIC_BASE_URL: "http://127.0.0.1:10000/devstoreaccount1"
  AZURE_STORAGE_CONTAINER: "azuredrop"
  MAX_UPLOAD_BYTES: "26214400"
  SHARE_TTL_MINUTES: "60"
  SIGNED_URL_TTL_MINUTES: "15"
