# Azurite - Azure Blob storage emulator (local cluster stand-in for Azure Blob).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: azurite-data
  labels:
    app.kubernetes.io/name: azurite
    app.kubernetes.io/part-of: azuredrop
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: azurite
  labels:
    app.kubernetes.io/name: azurite
    app.kubernetes.io/part-of: azuredrop
spec:
  type: ClusterIP
  ports:
    - name: blob
      port: 10000
      targetPort: 10000
  selector:
    app.kubernetes.io/name: azurite
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: azurite
  labels:
    app.kubernetes.io/name: azurite
    app.kubernetes.io/part-of: azuredrop
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: azurite
  template:
    metadata:
      labels:
        app.kubernetes.io/name: azurite
        app.kubernetes.io/part-of: azuredrop
    spec:
      containers:
        - name: azurite
          image: mcr.microsoft.com/azure-storage/azurite:3.33.0
          args:
            - azurite
            - --blobHost
            - "0.0.0.0"
            - --queueHost
            - "0.0.0.0"
            - --tableHost
            - "0.0.0.0"
            - --silent
            - --loose
            - --skipApiVersionCheck
          ports:
            - containerPort: 10000
          volumeMounts:
            - name: azurite-data
              mountPath: /data
          readinessProbe:
            tcpSocket:
              port: 10000
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: azurite-data
          persistentVolumeClaim:
            claimName: azurite-data
