# AzureDrop API (Node.js / Express).
apiVersion: v1
kind: Service
metadata:
  name: azuredrop-api
  labels:
    app.kubernetes.io/name: azuredrop-api
    app.kubernetes.io/part-of: azuredrop
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 5001
      targetPort: 5001
  selector:
    app.kubernetes.io/name: azuredrop-api
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: azuredrop-api
  labels:
    app.kubernetes.io/name: azuredrop-api
    app.kubernetes.io/part-of: azuredrop
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: azuredrop-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: azuredrop-api
        app.kubernetes.io/part-of: azuredrop
    spec:
      containers:
        - name: api
          image: azuredrop-api:latest
          ports:
            - containerPort: 5001
          envFrom:
            - configMapRef:
                name: azuredrop-config
            - secretRef:
                name: azuredrop-secret
          readinessProbe:
            httpGet:
              path: /health
              port: 5001
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 5001
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
