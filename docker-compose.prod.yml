# AzureDrop production stack for the AWS EC2 demo host.
# Only the frontend/Nginx container is published (80/443).
# PostgreSQL (5432) and Azurite (10000) stay on the private Docker network.
#
#   docker compose -f docker-compose.prod.yml up -d --build
#   docker compose -f docker-compose.prod.yml ps
#   curl -s https://your-domain.example/health | jq .

services:
  postgres:
    container_name: azuredrop-postgres
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: azuredrop
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: azuredrop
    volumes:
      - azuredrop-pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U azuredrop -d azuredrop"]
      interval: 10s
      timeout: 5s
      retries: 10
    # no ports: database is reachable only inside the Docker network

  azurite:
    container_name: azuredrop-azurite
    image: mcr.microsoft.com/azure-storage/azurite:3.33.0
    command: azurite --blobHost 0.0.0.0 --queueHost 0.0.0.0 --tableHost 0.0.0.0 --silent
    volumes:
      - azuredrop-azurite:/data
    restart: unless-stopped
    # no ports: blob storage is reached via Nginx /devstoreaccount1/ proxy

  backend:
    container_name: azuredrop-api
    build: ./backend
    environment:
      PORT: "5001"
      DATABASE_URL: postgresql://azuredrop:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/azuredrop
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      CORS_ORIGINS: ${CORS_ORIGINS:?set CORS_ORIGINS in .env}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?set PUBLIC_BASE_URL in .env}
      AZURE_STORAGE_CONNECTION_STRING: "DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;"
      AZURE_STORAGE_PUBLIC_BASE_URL: ${AZURE_STORAGE_PUBLIC_BASE_URL:?set AZURE_STORAGE_PUBLIC_BASE_URL in .env}
      AZURE_STORAGE_CONTAINER: ${AZURE_STORAGE_CONTAINER:-azuredrop}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-26214400}
      SHARE_TTL_MINUTES: ${SHARE_TTL_MINUTES:-60}
      SIGNED_URL_TTL_MINUTES: ${SIGNED_URL_TTL_MINUTES:-15}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      azurite:
        condition: service_started
    # no ports: reached only through the Nginx container

  frontend:
    container_name: azuredrop-frontend
    build:
      context: ./frontend
      args:
        # empty => same-origin API calls proxied by Nginx
        VITE_API_BASE_URL: ""
    ports:
      - "80:80"
      # Uncomment after configuring TLS certificates in ./certs (see README):
      # - "443:443"
    volumes:
      # - ./certs:/etc/nginx/certs:ro
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
    depends_on:
      - backend

volumes:
  azuredrop-pgdata:
  azuredrop-azurite:
